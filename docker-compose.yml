# TsukiAI web deployment. Copy .env.example to .env, fill in secrets, then:
#   docker compose up -d
# Cloudflare Tunnel terminates public TLS and forwards traffic to this HTTP origin.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Cloudflare Tunnel is the public ingress; do not expose the origin on
      # the VPS public interface.
      - "127.0.0.1:80:80"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Inside the compose network these point at sibling containers:
      - TSUKI_CHROMA_URL=http://chromadb:8000
      # Public Compose deployments must use the internal 8080 listener and
      # cookie/API-key auth; fail at interpolation time if either secret is
      # missing instead of starting an unreachable localhost-only container.
      - TSUKI_WEB_PASSWORD=${TSUKI_WEB_PASSWORD:?Set TSUKI_WEB_PASSWORD in .env}
      - TSUKI_API_KEY=${TSUKI_API_KEY:?Set TSUKI_API_KEY in .env}
      # Qwen3-TTS runs privately on the Azure VM host; the API container
      # reaches it through the host gateway. Fail fast if its API key is absent.
      - TSUKI_QWEN_TTS_URL=${TSUKI_QWEN_TTS_URL:-http://host.docker.internal:8100}
      - TSUKI_QWEN_TTS_API_KEY=${TSUKI_QWEN_TTS_API_KEY:?Set TSUKI_QWEN_TTS_API_KEY in .env}
      - TSUKI_SEMANTIC_MEMORY_ENABLED=true
      # API-side Groq STT uses the same read-only key pool as the bridge.
      - TSUKI_GROQ_API_KEYS_FILE=/run/secrets/tsuki-groq-keys
    volumes:
      - tsuki-data:/data
      - ${GROQ_KEYS_HOST_PATH:-./discord-voice-bridge/groq.keys}:/run/secrets/tsuki-groq-keys:ro
    depends_on:
      - chromadb

  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chroma-data:/chroma/chroma
  # 24/7 Discord voice assistant: joins your voice channel and drives the API.
  # Requires discord-voice-bridge/.env with DISCORD_TOKEN, GUILD_ID,
  # VOICE_CHANNEL_ID (see discord-voice-bridge/.env.example). TSUKI_API_KEY must
  # be set in the root .env so the bridge can authenticate to the API.
  bridge:
    build: ./discord-voice-bridge
    restart: on-failure:5
    stop_grace_period: 30s
    env_file: ./discord-voice-bridge/.env
    environment:
      CSHARP_API_URL: http://api:8080
      CSHARP_API_KEY: ${TSUKI_API_KEY:?Set TSUKI_API_KEY in .env}
      # Explicitly pass the rotation pool because older Compose versions can
      # mishandle long env_file values during container recreation.
      GROQ_API_KEYS: ${TSUKI_GROQ_API_KEYS:-}
      GROQ_API_KEYS_FILE: /run/secrets/tsuki-groq-keys
      # AssemblyAI v3 realtime keys are mounted read-only from outside Git.
      ASSEMBLYAI_KEYS_FILE: /run/secrets/assemblyai-keys
      ASSEMBLYAI_API_KEYS: ${TSUKI_ASSEMBLYAI_API_KEYS:-}
    volumes:
      # The host-side file is created with mode 600 and is excluded from the
      # image build context. The container only receives a read-only mount.
      - ${GROQ_KEYS_HOST_PATH:-./discord-voice-bridge/groq.keys}:/run/secrets/tsuki-groq-keys:ro
      # Set ASSEMBLYAI_KEYS_HOST_PATH in the root .env to the host-side key
      # file (for example C:/Users/.../assembly.txt). Never commit the file.
      - ${ASSEMBLYAI_KEYS_HOST_PATH:-./discord-voice-bridge/assemblyai.keys}:/run/secrets/assemblyai-keys:ro
    depends_on:
      - api

volumes:
  caddy-data:
  caddy-config:
  tsuki-data:
  chroma-data:
