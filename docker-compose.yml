# TsukiAI web deployment. Copy .env.example to .env, fill in secrets, then:
#   docker compose up -d
# Domain TLS is automatic via Caddy + Let's Encrypt (needs DNS A-record -> this host).

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network these point at sibling containers:
      - TSUKI_CHROMA_URL=http://chromadb:8000
      - TSUKI_VOICEVOX_BASE_URL=http://voicevox:50021
      - TSUKI_SEMANTIC_MEMORY_ENABLED=true
    volumes:
      - tsuki-data:/data
    depends_on:
      - chromadb

  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chroma-data:/chroma/chroma

  # Local English TTS (Kokoro-82M, CPU). The API routes: Japanese -> voicevox,
  # English -> kokoro. OpenAI-compatible endpoint at http://kokoro:8880.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    restart: unless-stopped

  # Optional: local TTS engine. Enable with: docker compose --profile voice up -d
  # and set TSUKI_VOICEVOX_BASE_URL=http://voicevox:50021 (compose sets it already).
  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    restart: unless-stopped
    profiles: ["voice"]

  # 24/7 Discord voice assistant: joins your voice channel and drives the API.
  # Requires discord-voice-bridge/.env with DISCORD_TOKEN, GUILD_ID,
  # VOICE_CHANNEL_ID (see discord-voice-bridge/.env.example). TSUKI_API_KEY must
  # be set in the root .env so the bridge can authenticate to the API.
  bridge:
    build: ./discord-voice-bridge
    restart: unless-stopped
    env_file: ./discord-voice-bridge/.env
    environment:
      CSHARP_API_URL: http://api:8080
      CSHARP_API_KEY: ${TSUKI_API_KEY:?Set TSUKI_API_KEY in .env}
    depends_on:
      - api

volumes:
  caddy-data:
  caddy-config:
  tsuki-data:
  chroma-data:
