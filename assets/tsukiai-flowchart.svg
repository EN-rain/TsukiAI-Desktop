<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1620" viewBox="0 0 1600 1620" role="img" aria-labelledby="title desc">
  <title id="title">TsukiAI Voice Pipeline Flowchart</title>
  <desc id="desc">Architecture flowchart showing TsukiAI voice input, STT, inference, memory, TTS, API, and output paths.</desc>
  <defs>
    <style>
      .bg { fill: #0f1220; }
      .title { fill: #f3f4f6; font: 700 30px 'Segoe UI', Arial, sans-serif; }
      .subtitle { fill: #a5b4fc; font: 400 16px 'Segoe UI', Arial, sans-serif; }
      .node { fill: #171b2e; stroke: #4f5d95; stroke-width: 2; rx: 16; ry: 16; }
      .decision { fill: #1b1730; stroke: #8b5cf6; stroke-width: 2; }
      .terminal { fill: #122033; stroke: #22c55e; stroke-width: 2; rx: 16; ry: 16; }
      .api { fill: #1d2438; stroke: #38bdf8; stroke-width: 2; rx: 16; ry: 16; }
      .memory { fill: #2a1f1b; stroke: #f59e0b; stroke-width: 2; rx: 16; ry: 16; }
      .text { fill: #e5e7eb; font: 600 16px 'Segoe UI', Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .small { fill: #cbd5e1; font: 500 13px 'Segoe UI', Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .label { fill: #93c5fd; font: 500 12px 'Segoe UI', Arial, sans-serif; text-anchor: middle; }
      .arrow { stroke: #94a3b8; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .arrowAlt { stroke: #c4b5fd; stroke-width: 2.5; fill: none; marker-end: url(#arrowAlt); }
      .group { fill: none; stroke: #27304f; stroke-width: 1.5; stroke-dasharray: 8 8; rx: 20; ry: 20; }
      .groupTitle { fill: #94a3b8; font: 600 14px 'Segoe UI', Arial, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAlt" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#c4b5fd"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1620"/>
  <text class="title" x="800" y="42">TsukiAI Voice Pipeline</text>
  <text class="subtitle" x="800" y="72">Input → STT → Context → Inference → TTS → Output</text>

  <rect class="group" x="80" y="110" width="1440" height="240"/>
  <text class="groupTitle" x="110" y="132">Input Layer</text>

  <rect class="terminal" x="680" y="150" width="240" height="64"/>
  <text class="text" x="800" y="182">Voice Input</text>

  <polygon class="decision" points="800,244 910,314 800,384 690,314"/>
  <text class="text" x="800" y="304">Input Source</text>
  <text class="small" x="800" y="324">Discord or local mic</text>

  <rect class="node" x="270" y="264" width="280" height="72"/>
  <text class="text" x="410" y="296">Node.js Voice Capture + VAD</text>
  <text class="small" x="410" y="316">Discord bridge</text>

  <rect class="node" x="1050" y="264" width="280" height="72"/>
  <text class="text" x="1190" y="296">C# Microphone Capture</text>
  <text class="small" x="1190" y="316">Local platform input</text>

  <rect class="group" x="80" y="390" width="1440" height="320"/>
  <text class="groupTitle" x="110" y="412">Speech Recognition Layer</text>

  <polygon class="decision" points="410,450 520,520 410,590 300,520"/>
  <text class="text" x="410" y="510">STT Mode</text>
  <text class="small" x="410" y="530">Discord path</text>

  <rect class="node" x="130" y="610" width="220" height="72"/>
  <text class="text" x="240" y="642">Groq Whisper</text>
  <text class="small" x="240" y="662">Cloud STT</text>

  <rect class="node" x="380" y="610" width="220" height="72"/>
  <text class="text" x="490" y="642">AssemblyAI</text>
  <text class="small" x="490" y="662">Cloud STT</text>

  <rect class="node" x="630" y="610" width="220" height="72"/>
  <text class="text" x="740" y="642">C# Whisper STT</text>
  <text class="small" x="740" y="662">Local STT</text>

  <rect class="node" x="1030" y="484" width="320" height="72"/>
  <text class="text" x="1190" y="516">Local STT Pipeline</text>
  <text class="small" x="1190" y="536">Microphone transcription path</text>

  <rect class="terminal" x="680" y="740" width="240" height="64"/>
  <text class="text" x="800" y="772">Transcribed Text</text>

  <rect class="group" x="80" y="840" width="1440" height="230"/>
  <text class="groupTitle" x="110" y="862">Context Assembly</text>

  <rect class="memory" x="360" y="900" width="300" height="76"/>
  <text class="text" x="510" y="932">Conversation History</text>
  <text class="small" x="510" y="954">Recent turns and persistence</text>

  <rect class="memory" x="940" y="900" width="300" height="76"/>
  <text class="text" x="1090" y="932">Semantic Memory Search</text>
  <text class="small" x="1090" y="954">Selective Chroma retrieval</text>

  <rect class="node" x="680" y="992" width="240" height="64"/>
  <text class="text" x="800" y="1024">Prompt Builder</text>

  <rect class="group" x="80" y="1090" width="1440" height="250"/>
  <text class="groupTitle" x="110" y="1112">Inference Layer</text>

  <polygon class="decision" points="800,1144 930,1220 800,1296 670,1220"/>
  <text class="text" x="800" y="1208">Inference Backend</text>
  <text class="small" x="800" y="1228">Provider selection</text>

  <rect class="node" x="360" y="1186" width="280" height="72"/>
  <text class="text" x="500" y="1218">RemoteInferenceClient</text>
  <text class="small" x="500" y="1238">OpenAI-compatible providers</text>

  <rect class="node" x="960" y="1186" width="280" height="72"/>
  <text class="text" x="1100" y="1218">OllamaClient</text>
  <text class="small" x="1100" y="1238">Local model execution</text>

  <rect class="terminal" x="680" y="1360" width="240" height="64"/>
  <text class="text" x="800" y="1392">LLM Response</text>

  <rect class="memory" x="1060" y="1360" width="280" height="64"/>
  <text class="text" x="1200" y="1392">Memory Write-Back Queue</text>

  <rect class="group" x="80" y="1450" width="1440" height="140"/>
  <text class="groupTitle" x="110" y="1472">Speech Synthesis and Output</text>

  <polygon class="decision" points="800,1488 900,1552 800,1616 700,1552"/>
  <text class="text" x="800" y="1540">TTS Mode</text>
  <text class="small" x="800" y="1560">Local or cloud</text>

  <rect class="node" x="390" y="1516" width="220" height="72"/>
  <text class="text" x="500" y="1548">Local VOICEVOX TTS</text>

  <rect class="node" x="990" y="1516" width="220" height="72"/>
  <text class="text" x="1100" y="1548">Cloud TTS</text>

  <rect class="terminal" x="1280" y="1516" width="220" height="72"/>
  <text class="text" x="1390" y="1540">PCM Audio Output</text>
  <text class="small" x="1390" y="1560">Discord or local playback</text>

  <rect class="api" x="1280" y="900" width="220" height="120"/>
  <text class="text" x="1390" y="930">Local HTTP API</text>
  <text class="small" x="1390" y="958">`/api/voice/stt`</text>
  <text class="small" x="1390" y="980">`/api/voice/process-binary`</text>
  <text class="small" x="1390" y="1002">memory + health endpoints</text>

  <rect class="terminal" x="1280" y="1098" width="220" height="72"/>
  <text class="text" x="1390" y="1130">Discord Playback</text>
  <text class="small" x="1390" y="1150">Bridge voice channel output</text>

  <rect class="terminal" x="1280" y="1200" width="220" height="72"/>
  <text class="text" x="1390" y="1232">Local Audio Playback</text>
  <text class="small" x="1390" y="1252">Desktop runtime output</text>

  <path class="arrow" d="M 800 214 L 800 236"/>
  <path class="arrow" d="M 700 314 L 550 314"/>
  <text class="label" x="625" y="302">Discord Bridge</text>
  <path class="arrow" d="M 910 314 L 1050 314"/>
  <text class="label" x="980" y="302">Local Microphone</text>

  <path class="arrow" d="M 410 336 L 410 442"/>
  <path class="arrow" d="M 1190 336 L 1190 476"/>

  <path class="arrow" d="M 330 548 L 250 610"/>
  <text class="label" x="290" y="596">Groq</text>
  <path class="arrow" d="M 410 590 L 490 610"/>
  <text class="label" x="452" y="598">AssemblyAI</text>
  <path class="arrow" d="M 490 548 L 730 610"/>
  <text class="label" x="620" y="594">Local</text>

  <path class="arrow" d="M 240 682 L 240 772 L 680 772"/>
  <path class="arrow" d="M 490 682 L 490 772 L 680 772"/>
  <path class="arrow" d="M 740 682 L 740 740"/>
  <path class="arrow" d="M 1190 556 L 1190 772 L 920 772"/>

  <path class="arrow" d="M 740 804 L 610 900"/>
  <path class="arrow" d="M 860 804 L 1040 900"/>
  <path class="arrow" d="M 800 804 L 800 992"/>

  <path class="arrow" d="M 660 938 L 800 992"/>
  <path class="arrow" d="M 940 938 L 920 992"/>
  <path class="arrow" d="M 800 1056 L 800 1136"/>

  <path class="arrow" d="M 670 1220 L 640 1220"/>
  <text class="label" x="654" y="1204">Remote Provider</text>
  <path class="arrow" d="M 930 1220 L 960 1220"/>
  <text class="label" x="946" y="1204">Local Ollama</text>

  <path class="arrow" d="M 640 1220 L 640 1392 L 680 1392"/>
  <path class="arrow" d="M 960 1220 L 920 1220 L 920 1392"/>
  <path class="arrow" d="M 920 1392 L 920 1392"/>

  <path class="arrowAlt" d="M 920 1392 L 1060 1392"/>
  <path class="arrow" d="M 800 1424 L 800 1480"/>
  <path class="arrow" d="M 700 1552 L 610 1552"/>
  <text class="label" x="654" y="1538">VOICEVOX Local</text>
  <path class="arrow" d="M 900 1552 L 990 1552"/>
  <text class="label" x="946" y="1538">Cloud TTS</text>

  <path class="arrow" d="M 610 1552 L 1280 1552"/>
  <path class="arrow" d="M 1210 1552 L 1280 1552"/>

  <path class="arrowAlt" d="M 800 772 L 1390 772 L 1390 900"/>
  <path class="arrowAlt" d="M 920 1392 L 1390 1392 L 1390 1020"/>
  <path class="arrowAlt" d="M 1390 1516 L 1390 1020"/>

  <path class="arrowAlt" d="M 1500 960 L 1540 960 L 1540 1134 L 1500 1134"/>
  <text class="label" x="1544" y="1050" transform="rotate(90 1544 1050)">Bridge Output</text>
  <path class="arrowAlt" d="M 1500 960 L 1520 960 L 1520 1236 L 1500 1236"/>
  <text class="label" x="1514" y="1098" transform="rotate(90 1514 1098)">Local Runtime</text>
</svg>
